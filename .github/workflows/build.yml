name: Build

# The recipes are compiled into dist/ and published on the flex/main branch, which is what Symfony Flex downloads.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile the recipes
        run: php bin/build.php

      - name: Publish dist/ on flex/main
        run: |
          cd dist
          git init -q -b flex/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" flex/main
